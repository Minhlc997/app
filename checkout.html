<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <!-- Apple TV specific meta tags -->
    <meta name="application-name" content="Pasha Photo Store">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pasha Photos">
    
    <title>Buy cool new product - Apple TV Compatible</title>
    <link rel="stylesheet" href="css/normalize.css">

  </head>
  <body>
    <div class="sr-root">
      <div class="sr-main">
        <section class="container">

              <h3>Stubborn Attachments</h3>
              <h5>$20.00</h5>

          </div>

        </section>
      </div>
    </div>
