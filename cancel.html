<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Cancelled - Apple TV Compatible</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/global.css" />
    <style>
      .cancel-container {
        text-align: center;
        padding: 40px;
      }
      
      .cancel-icon {
        font-size: 48px;
        color: #e25950;
        margin-bottom: 20px;
      }
      
      .cancel-message {
        color: #32325d;
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 15px;
      }
      
      .cancel-details {
        color: #525f7f;
        font-size: 16px;
        margin-bottom: 30px;
      }
      
      .return-button {
        background: #6772e5;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        height: 50px;
        padding: 0 24px;
        text-decoration: none;
        display: inline-block;
        line-height: 50px;
        transition: all 0.2s ease;
      }
      
      .return-button:hover {
        background: #5469d4;
        transform: translateY(-1px);
      }
      
      /* Apple TV optimizations */
      @media screen and (min-width: 1920px) and (min-height: 1080px) {
        .cancel-icon {
          font-size: 72px;
        }
        
        .cancel-message {
          font-size: 36px;
        }
        
        .cancel-details {
          font-size: 24px;
        }
        
        .return-button {
          font-size: 20px;
          height: 60px;
          line-height: 60px;
        }
      }
    </style>
  </head>
  <body>
    <div class="sr-root">
      <div class="sr-main">
        <div class="cancel-container">
          <div class="cancel-icon">✗</div>
          <div class="cancel-message">Payment Cancelled</div>
          <div class="cancel-details">
            Your payment was cancelled. No charges were made to your account.
            <br><br>
            You can return to continue shopping at any time.
          </div>
          <a href="/" class="return-button">Return to Shop</a>
        </div>
      </div>
    </div>
  </body>
</html>
